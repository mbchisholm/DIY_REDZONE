<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redzone Remote</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 16px; background: #111; color: #eee; font: 17px/1.3 system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 16px; color: #aaa; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #aaa; }
    select, button { width: 100%; padding: 12px; font: inherit; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    .row > * { flex: 1; }
    button.on { background: #1d5a2a; border-color: #3c9; }
    button.save { background: #2a3f6a; font-weight: 700; }
    #msg { min-height: 1.3em; color: #9cf; }
    #status { padding: 12px; border-radius: 8px; background: #1b1b1b; margin-bottom: 16px; }
    #status.lost { background: #3a1d1d; }
    #status.stale { background: #3a321d; }
    #state { font-size: 24px; font-weight: 800; }
    #status div { margin-top: 4px; font-size: 14px; color: #bbb; }
  </style>
</head>
<body>
  <h1>Redzone Remote</h1>
  <div id="status"><span id="state">…</span><div id="why"></div><div id="quad"></div><div id="seen"></div></div>
  <p>After building the multiview, set its four games and the highlighted tile, then Save. Auto off stops all presses. Re-save after using the TV remote yourself.</p>
  <div class="grid" id="tiles"></div>
  <label>Highlighted tile now</label>
  <div class="row"><select id="hl"><option>TL</option><option>TR</option><option>BL</option><option>BR</option></select></div>
  <div class="row"><button id="mode">Auto: off</button><button class="save" id="save">Save</button></div>
  <div id="msg"></div>
  <script type="module">
    import { SCOREBOARD_URL, normalizeScoreboard } from './feed.js';
    import { parseConfig } from './roku.js';

    const TILES = ['TL', 'TR', 'BL', 'BR'];
    const $ = (id) => document.getElementById(id);
    let mode = 'off';

    const [sb, txt] = await Promise.all([
      fetch(SCOREBOARD_URL, { cache: 'no-store' }).then((r) => r.json()).catch(() => null),
      fetch('tv.txt', { cache: 'no-store' }).then((r) => r.text()).catch(() => ''),
    ]);
    if (!sb) $('msg').textContent = 'ESPN unreachable: no game list. Auto on/off still saves.';
    const games = sb ? normalizeScoreboard(sb).filter((g) => g.state !== 'post').sort((a, b) => a.kickoff - b.kickoff) : [];
    const cfg = parseConfig(txt);
    const opts = ['<option value="">—</option>',
      ...games.map((g) => `<option value="${g.home.abbr}">${g.away.abbr} @ ${g.home.abbr}${g.state === 'in' ? '' : ' (pre)'}</option>`)].join('');
    $('tiles').innerHTML = TILES.map((t) => `<div><label>${t}</label><select id="t${t}">${opts}</select></div>`).join('');
    TILES.forEach((t, i) => {
      const abbr = cfg.teams[i];
      const g = games.find((g) => g.home.abbr === abbr || g.away.abbr === abbr);
      if (g) $(`t${t}`).value = g.home.abbr;
    });
    $('hl').value = TILES[cfg.tile];
    const showMode = () => { $('mode').textContent = `Auto: ${mode}`; $('mode').classList.toggle('on', mode === 'auto'); };
    mode = cfg.mode;
    showMode();
    $('mode').onclick = () => { mode = mode === 'auto' ? 'off' : 'auto'; showMode(); };

    $('save').onclick = async () => {
      const teams = TILES.map((t) => $(`t${t}`).value || '-');
      const body = `# Auto mode (roku.js). Line 1: auto | off\n${mode}\n# top-left top-right bottom-left bottom-right\n${teams.join(' ')}\n# Tile highlighted now\n${$('hl').value}\n`;
      const r = await fetch('/tv', { method: 'POST', body });
      $('msg').textContent = r.ok ? `Saved ${new Date().toLocaleTimeString()}. The kiosk's quad above updates within 10 s.` : `Save failed: ${r.status}`;
    };

    // What the kiosk last reported (roku.js report()), and the Roku's own player state.
    const poll = async () => {
      const [st, xml] = await Promise.all([
        // Age from the server's own clock (Date - Last-Modified), not the phone's.
        fetch('status.json', { cache: 'no-store' }).then(async (r) => (r.ok
          ? { ...(await r.json()), age: Math.round((Date.parse(r.headers.get('Date')) - Date.parse(r.headers.get('Last-Modified'))) / 1000) }
          : null)).catch(() => null),
        fetch('/roku/query/media-player', { cache: 'no-store' }).then((r) => r.text()).catch(() => ''),
      ]);
      const player = xml.match(/state="(\w+)"/)?.[1] ?? 'unreachable';
      const age = st?.age ?? null;
      const stale = age == null || age > 40;
      $('status').className = st?.lost ? 'lost' : stale ? 'stale' : '';
      $('state').textContent = !st ? 'Kiosk never reported' : st.lost ? 'TV LOST' : st.mode === 'auto' ? `AUTO · ${st.at}` : 'AUTO OFF';
      $('why').textContent = st?.lost ? `${st.lost}. Fix the TV, then Save.` : [st?.why, ...(st?.swaps ?? []).map((x) => `REBUILD? ${x}`)].filter(Boolean).join(' · ');
      $('quad').textContent = st ? `Kiosk's quad: ${st.quad.map((q, i) => `${TILES[i]} ${q}`).join('  ')}` : '';
      const moved = st?.movedAt ? `, last move ${st.lastKeys} ${Math.round((Date.now() - st.movedAt) / 60000)} min ago` : '';
      $('seen').textContent = `${stale ? 'Redzone tile not running on nova? ' : ''}Kiosk seen ${age ?? '—'} s ago${moved} · Roku ${player}`;
    };
    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
